<!DOCTYPE html>
<!-- Shown after "Sign out" (replaces ShinyProxy's default). app/setup.R fills in the logo. -->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="${title}"></title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
               background: #F4F4F5; color: #1D1D1B; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        .card { background: #fff; width: 100%; max-width: 400px; margin: 16px; padding: 32px; border-radius: 12px;
                border-top: 6px solid #EE7F00; box-shadow: 0 6px 24px rgba(0,0,0,0.08); }
        .logo { width: 170px; display: block; margin-bottom: 22px; }
        h1 { font-size: 24px; margin: 0 0 10px; }
        a { display: inline-block; margin-top: 18px; font-size: 18px; font-weight: 700; padding: 10px 20px; border-radius: 6px;
            background: #B35C00; border: 1px solid #B35C00; color: #fff; text-decoration: none; }
        .payoff { width: 260px; margin: 18px 0 0; }
    </style>
</head>
<body>
<main class="card">
    <img class="logo" src="{{LOGO}}" alt="Hanze"/>
    <h1>You are signed out.</h1>
    <p>Your answers are saved.</p>
    <a th:href="@{/}">Sign in again</a>
</main>
<img class="payoff" src="{{PAYOFF}}" alt="share your talent. move the world."/>
</body>
</html>

# The workshop stack. Use it through ./ws (it sets the variables below for Docker or podman).
#
#   api         R plumber: the only service with the answer key and the state database
#   shinyproxy  logins; starts one tutorial container per participant, and the facilitator app for the admin
#   caddy       HTTPS in front of ShinyProxy (profile "tls": when config.yml has an address)
#   setup, prepare-data, test   one-off tools (profile "tools")
#
# Tutorial and facilitator containers are not listed here: ShinyProxy starts them from the same image,
# configured in run/shinyproxy/application.yml (written by setup).
name: rworkshop

x-image: &image
  image: localhost/rworkshop:latest

x-tool: &tool
  <<: *image
  profiles: [tools]
  user: "0"
  environment:
    WS_HOST_RUN: ${WS_HOST_RUN:?run through ./ws}
    WS_WORKSHOP_ID: ${WS_WORKSHOP_ID:-omop_explore}
    WS_SELINUX: ${WS_SELINUX:-}
    WS_PUBLIC_URL: ${WS_PUBLIC_URL:-http://127.0.0.1:8080}
    WS_MEMORY: ${WS_MEMORY:-2g}
    WS_CPUS: ${WS_CPUS:-2}
    WS_IDLE_MS: ${WS_IDLE_MS:-1800000}
    WS_OWNER: ${WS_OWNER:-}
  volumes:
    - ./run:/run-dir${WS_RW:-}
  networks: [rworkshop]

services:
  api:
    <<: *image
    build:
      context: .
      dockerfile: server/Dockerfile
    user: "0"
    command: ["Rscript", "-e", "plumber::pr_run(plumber::pr('/srv/workshop/app/api.R'), host = '0.0.0.0', port = 8000, quiet = TRUE)"]
    environment:
      WS_WORKSHOP: /srv/workshop/workshops/${WS_WORKSHOP_ID:-omop_explore}
      WS_KEY: /secrets/key.yml
      WS_DB: /state/state.sqlite
    volumes:
      - ./run/state:/state${WS_RW:-}
      - ./workshops/${WS_WORKSHOP_ID:-omop_explore}/key.yml:/secrets/key.yml${WS_RO:-:ro}
    networks: [rworkshop]
    restart: unless-stopped

  shinyproxy:
    image: docker.io/openanalytics/shinyproxy:3.2.4
    user: "0"
    # It talks to the container engine's socket. SELinux (Fedora) blocks that for labelled containers;
    # this applies to ShinyProxy only, and is ignored where SELinux is off (Ubuntu).
    security_opt: ["label=disable"]
    volumes:
      - ./run/shinyproxy/application.yml:/opt/shinyproxy/application.yml${WS_RO:-:ro}
      - ./run/shinyproxy/templates:/opt/shinyproxy/templates${WS_RO:-:ro}
      - ${WS_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    ports:
      - "${WS_BIND:-127.0.0.1}:8080:8080"
    networks: [rworkshop]
    depends_on: [api]
    restart: unless-stopped

  caddy:   # HTTPS on the ports from config.yml; ./ws writes run/caddy/Caddyfile
    image: docker.io/library/caddy:2.10
    profiles: [tls]
    ports:
      - "${WS_HTTP_PORT:-80}:${WS_HTTP_PORT:-80}"
      - "${WS_HTTPS_PORT:-443}:${WS_HTTPS_PORT:-443}"
    volumes:
      - ./run/caddy/Caddyfile:/etc/caddy/Caddyfile${WS_RO:-:ro}
      - ${WS_CERTS:-./run/caddy}:/etc/letsencrypt${WS_RO:-:ro}
      - caddy-data:/data
    networks: [rworkshop]
    depends_on: [shinyproxy]
    restart: unless-stopped

  setup:
    <<: *tool
    command: ["Rscript", "/srv/workshop/app/setup.R"]

  prepare-data:
    <<: *tool
    command: ["Rscript", "/srv/workshop/app/prepare_data.R"]

  test:
    <<: *tool
    environment:
      WS_HOME: /src
    volumes:
      - .:/src${WS_RO:-:ro}
    command: ["Rscript", "-e", "testthat::test_dir('/src/tests/testthat', reporter = 'summary', stop_on_failure = TRUE)"]

  e2e:   # end-to-end test with headless browsers; image from server/Dockerfile.e2e (./ws e2e builds it)
    image: localhost/rworkshop-e2e:latest
    profiles: [tools]
    user: "0"
    shm_size: 1g
    volumes:
      - ./run:/run-dir${WS_RO:-:ro}
      - ./tests:/tests${WS_RO:-:ro}
    networks: [rworkshop]
    command: ["Rscript", "/tests/e2e.R"]

networks:
  rworkshop:
    name: rworkshop

volumes:
  caddy-data:
